<!doctype html>
<html lang="ja">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#f4f0e7"><title>接客から逃げろ</title><link rel="stylesheet" href="css/style.css"></head>
<body>
<main class="game">
 <header><a class="brand" href="./index.html">接客から逃げろ<span>JUST LOOKING, THANK YOU.</span></a><button id="sound" class="sound" aria-pressed="false">音 OFF</button></header>
 <section class="hud" aria-label="ゲーム状況"><div><small id="stage">STAGE 01 / 03</small><strong><span id="time">45</span><em>秒</em></strong></div><div class="shopping"><small>探している服</small><strong id="count">0 <em>/ 2</em></strong></div></section>
 <div class="field"><canvas id="canvas" width="720" height="1040" aria-label="服屋のゲームフィールド"></canvas><div id="overlay" class="overlay"></div></div>
 <div id="status" class="status" role="status" aria-live="polite">服は欲しい。でも、話しかけないで。</div>
 <section class="controls" aria-label="操作"><div id="stick" class="stick" aria-label="移動スティック"><span id="knob"></span><b>MOVE</b></div><div class="hint">視界をよけて、棚に隠れる。<br><span>WASD / 矢印キーでも移動</span></div><button id="item" class="item" disabled><span>≋</span><b>服を乱す</b><small id="stock">所持 0 / 1 · SPACE</small></button></section>
 <footer>欲しいものだけ、手に入れよう。<span>45 SEC / 3 STAGES</span></footer>
</main><script src="js/engine.js"></script><script src="js/game.js"></script>
</body></html>
